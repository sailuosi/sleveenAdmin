    <script language="javascript">
		function alertIsOK(text,callback,content, dangerMode=true, icon="warning", moreButtons={}){
          var nameEl=document.createElement("div");
          nameEl.className="tipcontent";
          if(content !=void 0){
            nameEl.innerHTML=content;	
                nameEl.setAttribute('style','max-height:700px;overflow:auto;');	
          }
          swal({
            text: text,icon: icon,
            content: nameEl,
            dangerMode: dangerMode,
            buttons: Object.assign({
              confirm: {text:"确认",value: "yes", visible: true,closeModal: true},
              cancel:  {text:"取消",value:"no", visible: true,},
            }, moreButtons),
          })
          .then((value) => {
            //swal(`You typed: ${value}`);
            if(typeof callback=="function"){
              callback(value);
            }
          });
        }
